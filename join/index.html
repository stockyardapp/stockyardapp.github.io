<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join a Stockyard league</title>
<link rel="icon" href="data:,">
<!--
  Static twin of supabase/functions/invite (which Supabase's free tier serves as
  text/plain, so it can never render). The code arrives as ?code=<CODE>; it is
  validated against the code alphabet and inserted only via textContent /
  encodeURIComponent, so nothing from the URL can be injected as markup.
-->
<style>
  body{font-family:-apple-system,system-ui,sans-serif;background:#0A0A0B;color:#F5F6F8;
    display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:24px;text-align:center}
  .card{background:#16181C;border:1px solid rgba(255,255,255,0.08);border-radius:22px;
    padding:32px 28px;max-width:360px;width:100%}
  h1{font-size:20px;font-weight:800;margin:0 0 6px}
  p{color:#8A9099;font-size:14px;line-height:20px;margin:0 0 20px}
  .code{background:#1E2128;border:1px solid rgba(255,255,255,0.08);border-radius:14px;
    padding:16px;font-size:28px;font-weight:800;letter-spacing:3px;user-select:all;-webkit-user-select:all}
  button,a.btn{display:block;width:100%;box-sizing:border-box;margin-top:14px;padding:14px;
    border-radius:14px;border:0;font-size:15px;font-weight:800;cursor:pointer;text-decoration:none}
  button{background:#2F80ED;color:#fff}
  a.btn{background:transparent;color:#2F80ED;border:1px solid rgba(255,255,255,0.08)}
  .hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <div id="invite" class="hidden">
    <h1>You're invited to a league</h1>
    <p>Open Stockyard, choose <b>Join a league</b>, and paste this invite code.</p>
    <div class="code" id="code"></div>
    <button id="copy">Copy code</button>
    <a class="btn" id="open" href="#">Open Stockyard</a>
  </div>
  <div id="bad" class="hidden">
    <h1>Invalid invite link</h1>
    <p>This link is missing its invite code. Ask your friend to share the league invite again.</p>
  </div>
</div>
<script>
  // Invite codes are 1-3 initials + 4 alphabet chars; old ones carry a hyphen.
  var CODE_RE = /^[A-Z0-9-]{4,16}$/;
  var raw = (new URLSearchParams(window.location.search).get('code') || '').trim().toUpperCase();
  if (!CODE_RE.test(raw)) {
    document.getElementById('bad').classList.remove('hidden');
  } else {
    var target = 'sharedfinance://join?code=' + encodeURIComponent(raw);
    document.getElementById('code').textContent = raw;
    document.getElementById('open').setAttribute('href', target);
    document.getElementById('invite').classList.remove('hidden');

    var btn = document.getElementById('copy');
    btn.addEventListener('click', function () {
      var done = function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy code'; }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(raw).then(done, fallback);
      } else { fallback(); }
      function fallback() {
        var range = document.createRange();
        range.selectNodeContents(document.getElementById('code'));
        var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
        try { document.execCommand('copy'); done(); } catch (e) { /* selection stays for a manual copy */ }
      }
    });

    // Deliberately NO auto-redirect to the scheme: while recipients are on
    // Expo Go the scheme is unregistered and iOS pops "cannot open page" on
    // load. "Open Stockyard" attempts it explicitly; auto-open can return
    // once standalone builds (or universal links) ship.
  }
</script>
</body>
</html>
